<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">从用户点击到模型回答的系统分层示意图</title>
  <desc id="desc">用户先操作应用界面，产品加入隐藏说明并选择模型，还可能连接搜索、知识库和商品规则，最后返回回答。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#176f66"/></marker>
    <style>
      .title{font-family:'PingFang SC','Microsoft YaHei',sans-serif;font-size:34px;font-weight:700;fill:#172522}.sub{font-family:'PingFang SC','Microsoft YaHei',sans-serif;font-size:20px;fill:#566763}.label{font-family:'PingFang SC','Microsoft YaHei',sans-serif;font-size:25px;font-weight:700;fill:#172522}.small{font-family:'PingFang SC','Microsoft YaHei',sans-serif;font-size:19px;fill:#42534f}.box{fill:#fffdf8;stroke:#176f66;stroke-width:3}.soft{fill:#e1f0ec;stroke:#176f66;stroke-width:2.5}.warn{fill:#fff0d8;stroke:#bb7921;stroke-width:2.5}.line{stroke:#176f66;stroke-width:4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="760" rx="28" fill="#faf6ed"/>
  <text x="60" y="65" class="title">一次点击背后的真实服务链</text>
  <text x="60" y="100" class="sub">这是结构示意图，不是服务器或模型的实际外观</text>
  <rect x="60" y="155" width="190" height="120" rx="18" class="box"/><text x="155" y="205" text-anchor="middle" class="label">用户</text><text x="155" y="240" text-anchor="middle" class="small">输入问题或照片</text>
  <path d="M250 215H330" class="line"/>
  <rect x="340" y="145" width="230" height="140" rx="18" class="soft"/><text x="455" y="198" text-anchor="middle" class="label">App 界面</text><text x="455" y="235" text-anchor="middle" class="small">按钮、账号、会员</text><text x="455" y="262" text-anchor="middle" class="small">数据和付款规则</text>
  <path d="M570 215H650" class="line"/>
  <rect x="660" y="135" width="260" height="160" rx="18" class="warn"/><text x="790" y="185" text-anchor="middle" class="label">产品后台</text><text x="790" y="222" text-anchor="middle" class="small">隐藏的系统提示词</text><text x="790" y="250" text-anchor="middle" class="small">模型路由与商品规则</text><text x="790" y="278" text-anchor="middle" class="small">用户通常看不见全部内容</text>
  <path d="M920 215H1000" class="line"/>
  <rect x="1010" y="155" width="140" height="120" rx="18" class="box"/><text x="1080" y="205" text-anchor="middle" class="label">模型</text><text x="1080" y="240" text-anchor="middle" class="small">生成回答</text>
  <path d="M790 295V385" class="line"/>
  <rect x="115" y="405" width="250" height="125" rx="18" class="box"/><text x="240" y="455" text-anchor="middle" class="label">联网搜索</text><text x="240" y="490" text-anchor="middle" class="small">可能包含实时网页</text>
  <rect x="475" y="405" width="250" height="125" rx="18" class="box"/><text x="600" y="455" text-anchor="middle" class="label">指定知识库</text><text x="600" y="490" text-anchor="middle" class="small">可能只含商家材料</text>
  <rect x="835" y="405" width="250" height="125" rx="18" class="warn"/><text x="960" y="455" text-anchor="middle" class="label">商品与广告规则</text><text x="960" y="490" text-anchor="middle" class="small">可能在模型之外插入</text>
  <path d="M790 385L240 405" class="line"/><path d="M790 385L600 405" class="line"/><path d="M790 385L960 405" class="line"/>
  <path d="M1080 275V625H665" class="line"/>
  <rect x="305" y="580" width="350" height="115" rx="18" class="soft"/><text x="480" y="627" text-anchor="middle" class="label">屏幕上的最终回答</text><text x="480" y="663" text-anchor="middle" class="small">可能同时受模型、资料和商业规则影响</text>
</svg>
