<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">检索增强生成与微调的区别示意图</title><desc id="desc">RAG在回答前查询外部资料，不改变基础模型参数；微调用示例继续训练权重或新增适配参数。</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#176f66"/></marker><style>.t{font-family:'PingFang SC','Microsoft YaHei',sans-serif;font-size:34px;font-weight:700;fill:#172522}.h{font-family:'PingFang SC','Microsoft YaHei',sans-serif;font-size:27px;font-weight:700;fill:#172522}.p{font-family:'PingFang SC','Microsoft YaHei',sans-serif;font-size:19px;fill:#465955}.box{fill:#fffdf8;stroke:#176f66;stroke-width:3}.left{fill:#e2f0ec;stroke:#176f66;stroke-width:3}.right{fill:#fff0d8;stroke:#bb7921;stroke-width:3}.line{stroke:#176f66;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="760" rx="28" fill="#faf6ed"/><text x="55" y="62" class="t">RAG 与微调：都能改变结果，但改变的位置不同</text>
  <rect x="55" y="110" width="525" height="580" rx="24" class="left"/><text x="317" y="160" text-anchor="middle" class="h">RAG（检索增强生成）</text>
  <rect x="145" y="205" width="345" height="75" rx="14" class="box"/><text x="317" y="250" text-anchor="middle" class="h">用户提出问题</text><path d="M317 280V335" class="line"/>
  <rect x="145" y="345" width="345" height="95" rx="14" class="box"/><text x="317" y="383" text-anchor="middle" class="h">先查询外部资料</text><text x="317" y="415" text-anchor="middle" class="p">取回相关资料片段</text><path d="M317 440V495" class="line"/>
  <rect x="145" y="505" width="345" height="95" rx="14" class="box"/><text x="317" y="543" text-anchor="middle" class="h">模型根据片段回答</text><text x="317" y="575" text-anchor="middle" class="p">基础参数没有因此改变</text><text x="317" y="645" text-anchor="middle" class="p">适合：新资料、内部文件、引用</text>
  <rect x="620" y="110" width="525" height="580" rx="24" class="right"/><text x="882" y="160" text-anchor="middle" class="h">Fine-tuning（微调）</text>
  <rect x="710" y="205" width="345" height="75" rx="14" class="box"/><text x="882" y="250" text-anchor="middle" class="h">准备特定示例</text><path d="M882 280V335" class="line"/>
  <rect x="710" y="345" width="345" height="95" rx="14" class="box"/><text x="882" y="383" text-anchor="middle" class="h">继续训练模型</text><text x="882" y="415" text-anchor="middle" class="p">更新权重或新增适配参数</text><path d="M882 440V495" class="line"/>
  <rect x="710" y="505" width="345" height="95" rx="14" class="box"/><text x="882" y="543" text-anchor="middle" class="h">行为更稳定</text><text x="882" y="575" text-anchor="middle" class="p">格式、风格或窄任务改变</text><text x="882" y="645" text-anchor="middle" class="p">适合：重复格式、稳定任务习惯</text>
  <text x="600" y="728" text-anchor="middle" class="p">两者可以同时使用；“有专用资料”不等于“训练了专用模型”</text>
</svg>
