<svg xmlns="http://www.w3.org/2000/svg" width="720" height="850" viewBox="0 0 720 850" role="img" aria-labelledby="title desc">
  <title id="title">有意义的 AI 多轮对话</title><desc id="desc">用户先约定目标，AI 一次问一个问题并复述确认，再提出不同角度，形成小成果，由用户验收并决定继续或停止。</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#176f66"/></marker><style>.t{font-family:'PingFang SC','Microsoft YaHei',sans-serif;font-size:42px;font-weight:700;fill:#172522}.h{font-family:'PingFang SC','Microsoft YaHei',sans-serif;font-size:37px;font-weight:700;fill:#172522}.p{font-family:'PingFang SC','Microsoft YaHei',sans-serif;font-size:28px;fill:#465955}.box{fill:#fffdf8;stroke:#176f66;stroke-width:3}.accent{fill:#e2f0ec;stroke:#176f66;stroke-width:3}.warn{fill:#fff0d8;stroke:#bb7921;stroke-width:3}.line{stroke:#176f66;stroke-width:5;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="720" height="850" rx="28" fill="#faf6ed"/><text x="360" y="58" text-anchor="middle" class="t">有意义的多轮对话</text>
  <rect x="35" y="105" width="285" height="160" rx="18" class="accent"/><text x="177" y="155" text-anchor="middle" class="h">1. 约定目标</text><text x="177" y="205" text-anchor="middle" class="p">先澄清还是建议</text><text x="177" y="242" text-anchor="middle" class="p">何时可以停止</text>
  <path d="M320 185H382" class="line"/><rect x="400" y="105" width="285" height="160" rx="18" class="box"/><text x="542" y="155" text-anchor="middle" class="h">2. 一次一问</text><text x="542" y="205" text-anchor="middle" class="p">用户可以回答</text><text x="542" y="242" text-anchor="middle" class="p">跳过或纠正</text>
  <path d="M542 265V315" class="line"/><rect x="400" y="330" width="285" height="160" rx="18" class="box"/><text x="542" y="380" text-anchor="middle" class="h">3. 复述确认</text><text x="542" y="430" text-anchor="middle" class="p">区分事实与假设</text><text x="542" y="467" text-anchor="middle" class="p">请用户校准</text>
  <path d="M400 410H338" class="line"/><rect x="35" y="330" width="285" height="160" rx="18" class="warn"/><text x="177" y="380" text-anchor="middle" class="h">4. 不同角度</text><text x="177" y="430" text-anchor="middle" class="p">礼貌指出矛盾</text><text x="177" y="467" text-anchor="middle" class="p">不要只迎合</text>
  <path d="M177 490V540" class="line"/><rect x="35" y="555" width="285" height="160" rx="18" class="box"/><text x="177" y="605" text-anchor="middle" class="h">5. 小成果</text><text x="177" y="655" text-anchor="middle" class="p">摘要、提纲</text><text x="177" y="692" text-anchor="middle" class="p">或今天的一步</text>
  <path d="M320 635H382" class="line"/><rect x="400" y="555" width="285" height="160" rx="18" class="accent"/><text x="542" y="605" text-anchor="middle" class="h">6. 用户验收</text><text x="542" y="655" text-anchor="middle" class="p">确认、继续</text><text x="542" y="692" text-anchor="middle" class="p">纠正或停止</text>
  <text x="360" y="782" text-anchor="middle" class="p">AI 帮助澄清和生成候选内容</text><text x="360" y="821" text-anchor="middle" class="p">人负责目标、判断、隐私和最终决定</text>
</svg>
