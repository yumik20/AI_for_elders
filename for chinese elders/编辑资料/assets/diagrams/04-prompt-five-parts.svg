<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">一份清楚提示词的五个组成部分</title><desc id="desc">任务、背景、材料、输出和限制共同组成可执行的提示词，由用户检查后交给模型。</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#176f66"/></marker><style>.t{font-family:'PingFang SC','Microsoft YaHei',sans-serif;font-size:34px;font-weight:700;fill:#172522}.h{font-family:'PingFang SC','Microsoft YaHei',sans-serif;font-size:26px;font-weight:700;fill:#172522}.p{font-family:'PingFang SC','Microsoft YaHei',sans-serif;font-size:18px;fill:#465955}.box{fill:#fffdf8;stroke:#176f66;stroke-width:3}.accent{fill:#e2f0ec;stroke:#176f66;stroke-width:3}.warn{fill:#fff0d8;stroke:#bb7921;stroke-width:3}.line{stroke:#176f66;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="690" rx="28" fill="#faf6ed"/><text x="55" y="62" class="t">清楚提示词的五个部件：减少模型必须猜测的地方</text>
  <rect x="55" y="130" width="200" height="135" rx="18" class="accent"/><text x="155" y="180" text-anchor="middle" class="h">1. 任务</text><text x="155" y="217" text-anchor="middle" class="p">具体要做什么</text><text x="155" y="244" text-anchor="middle" class="p">先采访还是直接写</text>
  <rect x="280" y="130" width="200" height="135" rx="18" class="box"/><text x="380" y="180" text-anchor="middle" class="h">2. 背景</text><text x="380" y="217" text-anchor="middle" class="p">给谁使用</text><text x="380" y="244" text-anchor="middle" class="p">为什么要做</text>
  <rect x="505" y="130" width="200" height="135" rx="18" class="box"/><text x="605" y="180" text-anchor="middle" class="h">3. 材料</text><text x="605" y="217" text-anchor="middle" class="p">允许根据什么</text><text x="605" y="244" text-anchor="middle" class="p">哪些是原始资料</text>
  <rect x="730" y="130" width="200" height="135" rx="18" class="box"/><text x="830" y="180" text-anchor="middle" class="h">4. 输出</text><text x="830" y="217" text-anchor="middle" class="p">长度、结构和格式</text><text x="830" y="244" text-anchor="middle" class="p">先提纲还是成稿</text>
  <rect x="955" y="130" width="200" height="135" rx="18" class="warn"/><text x="1055" y="180" text-anchor="middle" class="h">5. 限制</text><text x="1055" y="217" text-anchor="middle" class="p">不能猜什么</text><text x="1055" y="244" text-anchor="middle" class="p">哪些内容不能改变</text>
  <path d="M155 265V350H600" class="line"/><path d="M380 265V350H600" class="line"/><path d="M605 265V350" class="line"/><path d="M830 265V350H610" class="line"/><path d="M1055 265V350H610" class="line"/>
  <rect x="360" y="365" width="490" height="120" rx="20" class="accent"/><text x="605" y="413" text-anchor="middle" class="h">一份可以检查的工作说明</text><text x="605" y="450" text-anchor="middle" class="p">模型复述目标 → 用户确认 → 再执行</text>
  <path d="M605 485V535" class="line"/><rect x="395" y="545" width="420" height="90" rx="18" class="box"/><text x="605" y="582" text-anchor="middle" class="h">结果仍需由人验收</text><text x="605" y="613" text-anchor="middle" class="p">提示词更清楚，不等于答案自动正确</text>
</svg>
