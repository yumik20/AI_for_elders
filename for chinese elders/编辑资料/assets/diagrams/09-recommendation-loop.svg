<svg xmlns="http://www.w3.org/2000/svg" width="760" height="580" viewBox="0 0 760 580">
  <rect width="760" height="580" rx="30" fill="#fbf7ef"/>
  <text x="380" y="55" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="34" font-weight="700" fill="#172522">推荐反馈回路</text>
  <g font-family="PingFang SC, sans-serif" font-size="24" text-anchor="middle">
    <rect x="265" y="88" width="230" height="78" rx="20" fill="#087f73"/><text x="380" y="136" fill="white">偶然看见视频</text>
    <rect x="500" y="210" width="220" height="82" rx="20" fill="#dcefeb"/><text x="610" y="247" fill="#172522">停留、评论</text><text x="610" y="276" font-size="20" fill="#5f706b">即使是在反驳</text>
    <rect x="425" y="390" width="245" height="82" rx="20" fill="#fff0d4"/><text x="548" y="438" fill="#172522">推荐更多相似内容</text>
    <rect x="90" y="390" width="245" height="82" rx="20" fill="#dcefeb"/><text x="212" y="426" fill="#172522">感觉“大家都说”</text><text x="212" y="457" font-size="20" fill="#5f706b">再次观看或转发</text>
    <rect x="38" y="210" width="220" height="82" rx="20" fill="#fff0d4"/><text x="148" y="247" fill="#172522">系统记录兴趣</text><text x="148" y="276" font-size="20" fill="#5f706b">不等于判断真实</text>
    <path d="M495 136C580 150 618 176 625 210M610 292C610 338 590 365 565 390M425 440C380 470 335 470 290 440M195 390C155 360 140 330 145 292M148 210C160 160 225 135 265 130" fill="none" stroke="#087f73" stroke-width="7" marker-end="url(#a)"/>
  </g>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#087f73"/></marker></defs>
  <text x="380" y="535" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="22" fill="#5f706b">重复出现是推荐信号，不是独立证据</text>
</svg>
